---
- name: FortiGate Interface Status
  hosts: fortigates
  gather_facts: false

  collections:
    - fortinet.fortios

  tasks:

    - name: Get FortiGate interface information
      fortinet.fortios.fortios_monitor_fact:
        vdom: "root"
        selector: "system_interface_select"
      register: interface_info

    - name: Display interface information
      ansible.builtin.debug:
        var: interface_info
